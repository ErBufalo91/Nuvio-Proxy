events { worker_connections 1024; }

http {
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    server {
        listen 10000;

        # Gestisce le richieste indirizzate su /proxy
        location /proxy {
            # Se l'URL di destinazione viene inviato come parametro ?url=
            if ($arg_url ~* "^(https?://.+)$") {
                proxy_pass $arg_url;
            }

            # Configurazione specifica per evitare scatti nello streaming
            proxy_buffering off;
            proxy_set_header Connection "keep-alive";
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_store off;

            # Intestazioni per bypassare i blocchi dei siti di streaming
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Pagina iniziale di verifica
        location / {
            return 200 "Proxy attivo e pronto per Nuvio!";
            add_header Content-Type text/plain;
        }
    }
}
